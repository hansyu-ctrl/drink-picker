<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>手搖飲隨機抽</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--text:#2a2118;--muted:#85776a;--line:#eadfce;--accent:#d9622b;--soft:#fdeadb}
@media(prefers-color-scheme:dark){:root{--bg:#17130f;--card:#221c16;--text:#f4ece1;--muted:#a89b8c;--line:#3a3128;--accent:#ff8a4c;--soft:#33261c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0}.sub{color:var(--muted);margin:4px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.big{width:100%;padding:15px;background:var(--accent);color:#fff;font-size:1.1rem;font-weight:700}
.big:disabled{opacity:.5;cursor:default}
.ghost{background:var(--soft);color:var(--text);padding:10px 14px;font-size:.9rem}
.chips{display:flex;gap:8px;margin-bottom:12px}.chip{flex:1;padding:10px 6px;background:var(--soft);color:var(--text);border:2px solid transparent;font-size:.9rem;line-height:1.35}.chip[aria-pressed="true"]{border-color:var(--accent);font-weight:700}.chip small{display:block;color:var(--muted);font-weight:400}
.status{font-size:.9rem;color:var(--muted);margin-top:10px}
.slot{height:130px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.7rem;font-weight:800;border-radius:14px;background:var(--soft);padding:10px;transition:transform .15s}
.slot.spin{animation:pulse .18s infinite alternate}@keyframes pulse{to{transform:scale(1.03)}}
#res{display:none;perspective:900px}
.flip{animation:flip .7s}@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
.shop{font-size:1.5rem;font-weight:800;margin:0}.dist{color:var(--muted);font-size:.9rem}
.drink{margin-top:14px;padding:16px;border-radius:14px;background:var(--soft)}
.drink small{color:var(--muted)}.drink b{display:block;font-size:1.4rem;margin:2px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row>*{flex:1;text-align:center;text-decoration:none}
a.ghost{color:var(--text);border-radius:12px}
details summary{cursor:pointer;font-weight:600}li{padding:3px 0;font-size:.92rem}ul{padding-left:18px;margin:8px 0 0}
.note{font-size:.76rem;color:var(--muted)}
</style></head><body><main>
<h1>🧋 手搖飲隨機抽</h1><p class="sub">抓你的位置，選好步行或騎車範圍，抽附近的一間手搖店，再丟一杯給你喝。</p>

<div class="card">
  <div class="chips"><button class="chip" data-r="1000" aria-pressed="true">🚶 步行 1 公里內<small>約 12 分鐘</small></button><button class="chip" data-r="3000" aria-pressed="false">🛵 騎車 3 公里內<small>約 8 分鐘</small></button></div>
  <button class="big" id="loc">📍 取得我的位置，搜尋附近手搖店</button>
  <div class="status" id="st">需要允許瀏覽器使用定位。位置只在你的裝置上使用。</div>
  <details id="listBox" style="display:none;margin-top:12px"><summary id="sum"></summary><ul id="list"></ul></details>
</div>

<div class="card"><div class="slot" id="slot">?</div>
  <button class="big" id="draw" style="margin-top:12px" disabled>抽一間！</button></div>

<div class="card" id="res">
  <p class="shop" id="sn"></p><div class="dist" id="sd"></div>
  <div class="drink"><small>推薦你喝</small><b id="dn"></b><small id="dt"></small></div>
  <div class="row"><button class="ghost" id="again">換一杯</button><button class="ghost" id="redo">重抽店家</button>
  <a class="ghost" id="nav" target="_blank" rel="noopener">導航 ↗</a></div>
</div>
<p class="note">店家資料來自 OpenStreetMap 志工標註，可能缺漏或已歇業；飲品為各品牌人氣品項整理，無菜單者從通用品項抽，實際請以現場菜單為準。</p>
</main>
<script>
const MENU={
"50嵐":["波霸奶茶","四季春茶","檸檬綠茶","紅茶拿鐵","梅子綠茶","冰淇淋紅茶","8冰綠"],
"清心":["烏龍綠茶","冬瓜檸檬","珍珠奶茶","柚香綠茶","四季春珍珠","梅子綠茶"],
"可不可":["熟成紅茶","白玉歐蕾","春芽冷露","熟成歐蕾","白玉熟成"],
"迷客夫":["珍珠紅茶拿鐵","大甲芋頭鮮奶","鮮奶茶","蜂蜜綠茶","芋頭鮮奶"],
"CoCo|都可":["珍珠奶茶","百香雙響炮","奶茶三兄弟","檸檬綠茶","芒果冰沙"],
"麻古":["芝芝葡萄","楊枝甘露","芝芝芒果","葡萄柚綠茶"],
"五桐號":["芝士奶蓋紅茶","冰淇淋紅茶","柳橙綠茶","鮮奶茶"]};
const GENERIC=["珍珠奶茶","四季春茶","檸檬綠茶","紅茶拿鐵","冬瓜檸檬","烏龍綠茶","芒果冰沙","百香綠茶","鮮奶茶","仙草奶凍","蜂蜜檸檬","葡萄柚綠茶"];
const $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let R=1000,me=null,shops=[],cur=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function menuFor(n){for(const k in MENU)if(new RegExp(k,"i").test(n))return[MENU[k],true];return[GENERIC,false]}
function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dg=t(d-b);
 const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function fmt(m){return m<1000?Math.round(m)+" 公尺":(m/1000).toFixed(1)+" 公里"}

$("loc").onclick=()=>{
 if(!navigator.geolocation){$("st").textContent="這個瀏覽器不支援定位";return}
 $("loc").disabled=true;$("st").textContent="定位中…";
 navigator.geolocation.getCurrentPosition(async p=>{
  me={lat:p.coords.latitude,lon:p.coords.longitude};$("st").textContent="已定位，搜尋附近店家中…";
  try{await load()}catch(e){$("st").textContent="搜尋失敗（"+e.message+"），請稍後再試";}
  $("loc").disabled=false;
 },e=>{$("st").textContent=e.code==1?"你拒絕了定位權限，請在瀏覽器設定中允許後重試":"無法取得位置，請再試一次";$("loc").disabled=false},
 {enableHighAccuracy:true,timeout:15000});
};
async function load(){
 const a=`(around:${R},${me.lat},${me.lon})`,brands="50嵐|清心|可不可|迷客夫|CoCo|都可|麻古|五桐號|大苑子|龜記|烏弄|得正|鶴茶樓|珍煮丹|春水堂|茶湯會|一沐日|老虎堂|圓石禪茶|日出茶太|萬波|拾汣|八曜|再睡5分鐘|手搖|茶飲|飲料|紅茶|綠茶|奶茶|冰品";
 const q=`[out:json][timeout:25];(nwr${a}["cuisine"="bubble_tea"];nwr${a}["shop"~"^(tea|beverages)$"]["name"];nwr${a}["amenity"~"^(cafe|fast_food|ice_cream)$"]["name"~"${brands}"];);out center tags 300;`;
 const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)});
 if(!r.ok)throw new Error("伺服器忙碌 "+r.status);
 const j=await r.json(),seen=new Set();shops=[];
 for(const e of j.elements){const t=e.tags||{},name=t.name||t["name:zh"];if(!name)continue;
  const la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;if(la==null)continue;
  const d=dist(me.lat,me.lon,la,lo);if(d>R)continue;
  const key=name+la.toFixed(3)+lo.toFixed(3);if(seen.has(key))continue;seen.add(key);
  shops.push({name,la,lo,d})}
 shops.sort((x,y)=>x.d-y.d);
 $("st").textContent=shops.length?`找到 ${shops.length} 間，按下面的按鈕抽一間！`:`${R/1000} 公里內沒找到（OpenStreetMap 資料可能不足）`;
 $("draw").disabled=!shops.length;$("listBox").style.display=shops.length?"block":"none";
 $("sum").textContent=`附近 ${shops.length} 間手搖店`;
 $("list").innerHTML=shops.map(s=>`<li>${s.name.replace(/</g,"&lt;")}　<span class="dist">${fmt(s.d)}</span></li>`).join("");
}
async function draw(){
 if(!shops.length)return;$("draw").disabled=true;$("res").style.display="none";
 const s=$("slot");s.classList.add("spin");let d=60;
 for(let i=0;i<20;i++){s.textContent=pick(shops).name;await sleep(d);d*=1.1}
 s.classList.remove("spin");cur=pick(shops);s.textContent=cur.name;
 $("sn").textContent=cur.name;$("sd").textContent=`距離你約 ${fmt(cur.d)}`;
 $("nav").href=`https://www.google.com/maps/search/?api=1&query=${cur.la},${cur.lo}`;
 drink();$("res").style.display="block";$("res").classList.remove("flip");void $("res").offsetWidth;$("res").classList.add("flip");
 $("res").scrollIntoView({behavior:"smooth",block:"nearest"});$("draw").disabled=false}
function drink(){const[m,known]=menuFor(cur.name);let n;do{n=pick(m)}while(n===$("dn").textContent&&m.length>1);
 $("dn").textContent=n;$("dt").textContent=known?"依該品牌人氣品項整理":"（未收錄此店菜單，從通用品項抽）"}
document.querySelectorAll(".chip").forEach(b=>b.onclick=async()=>{R=+b.dataset.r;
 document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));
 if(me){$("res").style.display="none";$("st").textContent="重新搜尋中…";try{await load()}catch(e){$("st").textContent="搜尋失敗（"+e.message+"）"}}});
$("draw").onclick=draw;$("redo").onclick=draw;$("again").onclick=drink;
</script></body></html>
